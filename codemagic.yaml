# Codemagic 云端构建配置 —— EB2排期追踪 (Capacitor 8)
# 参考文档: https://docs.codemagic.io/yaml-quick-start/building-an-ionic-app/
#
# 仓库: https://github.com/leiloull/eb2-visa-tracker
# App ID: com.workbuddy.eb2tracker / 名称: EB2排期追踪
#
# 三个工作流:
#   android-debug     —— 零凭据，直接出可安装 debug APK（推荐先跑这个验证）
#   android-release   —— 需签名凭据，出正式 APK + AAB
#   ios-app-store     —— macOS 构建机 + Apple 签名，出 IPA
#
# 实例类型统一用 mac_mini_m2：Codemagic 免费个人计划每月有 500 分钟 M2 免费额度，
# 而 linux_x2 / linux_x4 / mac_mini_m4 / windows_x2 都需开启付费 billing 才能用。
# Android 在 macOS 上构建完全可行（Capacitor 官方范例即如此）。
# Capacitor 8 需 JDK 21（构建机默认 17，会报 invalid source release: 21），故 environment 里指定 java: 21。
#
# 构建产物到 Codemagic 构建详情页的 Artifacts 标签下载。
# 说明：本配置刻意不启用 publishing.email，避免未设置 CM_BUILD_EMAIL 时
#       触发 "recipients -> 0 none is not an allowed value" 校验错误。
#       如需邮件通知，可自行在单个 workflow 末尾追加：
#         publishing:
#           email:
#             recipients:
#               - your@email.com   # 写固定邮箱，不要用未定义的环境变量

definitions:
  scripts:
    - &install_deps
      name: Install npm dependencies
      script: npm ci

    - &set_android_sdk
      name: Set Android SDK location
      script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

    - &sync_web
      name: Sync web assets into native projects
      # www/ 被 .gitignore 排除，CI 上不存在；cap:sync 会先跑 sync:web 生成 www/ 再 cap sync
      script: npm run cap:sync

  artifacts:
    - &android_artifacts
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

workflows:
  # ---------- 1. Android Debug APK：零凭据，先跑这个验证整条链路 ----------
  android-debug:
    name: Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - *install_deps
      - *set_android_sdk
      - *sync_web
      - name: Build debug APK
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          echo "JAVA_HOME=$JAVA_HOME"
          cd android && bash ./gradlew assembleDebug
    artifacts: *android_artifacts

  # ---------- 2. Android Release：正式签名 APK / AAB ----------
  #  需要在 Codemagic 建环境变量组 "eb2-app-credentials"，见 README。
  #  keystore 通过环境变量组的 base64 注入，build.gradle 已支持 EB2_UPLOAD_* 变量
  android-release:
    name: Android Release (signed)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      groups:
        - eb2-app-credentials
    scripts:
      - *install_deps
      - *set_android_sdk
      - *sync_web
      - name: Decode keystore
        script: echo "$ANDROID_KEYSTORE_FILE" | base64 --decode > android/app/eb2-release.keystore
      - name: Configure signing
        script: |
          cat >> android/gradle.properties <<EOF
          EB2_UPLOAD_STORE_FILE=eb2-release.keystore
          EB2_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
          EB2_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          EB2_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build signed release
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          echo "JAVA_HOME=$JAVA_HOME"
          cd android && bash ./gradlew assembleRelease bundleRelease
    artifacts: *android_artifacts

  # ---------- 3. iOS App Store IPA：必须 macOS + Apple 签名凭据 ----------
  ios-app-store:
    name: iOS App Store IPA
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 22
      groups:
        - eb2-app-credentials
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.workbuddy.eb2tracker
    scripts:
      - *install_deps
      - *sync_web
      - name: Install CocoaPods
        script: cd ios/App && pod install --repo-update
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: xcode-project increment-build-number --build-dir ios/App
      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
